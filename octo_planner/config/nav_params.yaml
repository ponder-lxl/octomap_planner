d1_controller:
  ros__parameters:

    path_topic: /planned_path
    start_navigation_topic: /start_navigation
    stop_navigation_topic: /stop_navigation
    cmd_vel_topic: /cmd_vel
    manual_cmd_vel_topic: /manual_cmd_vel
    tracking_point_marker_topic: /tracking_point_marker

    map_frame: map
    base_frame: body
    base_frame_candidates: base_footprint,base_link

    robot_center_offset_frame: base_footprint
    robot_center_offset_x: 0.0
    robot_center_offset_y: 0.0
    robot_center_offset_z: 0.0

    enable_lateral_motion: false

    require_start_command: false

    control_frequency: 20.0
    lookahead_distance: 0.35
    tracking_point_reached_xy_tolerance: 0.35
    tracking_point_marker_scale: 0.22

    enable_tracking_debug_view: false

    linear_gain: 0.9
    lateral_gain: 0.0
    heading_gain: 1.2
    cross_track_angular_gain: 0.6

    final_yaw_gain: 0.4

    max_linear_speed: 0.22
    max_lateral_speed: 0.0
    max_angular_speed: 0.9

    align_final_yaw: true
    linear_deadband: 0.02
    lateral_deadband: 0.0
    angular_deadband: 0.05
    goal_position_tolerance: 0.12
    goal_yaw_tolerance: 0.25

    local_safety_stop_enable: true
    local_safety_stop_cloud_topic: /cloud_registered_body
    local_safety_stop_target_frame: body
    local_safety_stop_tf_timeout_sec: 0.15
    local_safety_stop_use_horizontal_clearance: true
    local_safety_stop_robot_radius: 0.22
    local_safety_stop_distance: 0.50
    local_safety_stop_slow_distance: 1.0
    local_safety_stop_check_min_x: 0.0
    local_safety_stop_check_max_x: 1.3
    local_safety_stop_check_half_width: 0.35
    local_safety_stop_check_min_z: -0.15
    local_safety_stop_check_max_z: 0.85
    local_safety_stop_min_clearance_ignore: 0.03
    local_safety_stop_min_points: 3
    local_safety_stop_min_points_when_close: 1
    local_safety_stop_clearance_hold_sec: 0.30
    local_safety_stop_cloud_timeout_sec: 0.5
    local_safety_stop_on_stale_cloud: true
    local_safety_stop_stop_angular: true
    local_safety_stop_limit_angular_in_slow: true
    local_safety_stop_slow_scale_min: 0.10
    local_safety_stop_robot_forward_margin: 0.22
    local_safety_stop_zero_linear_threshold: 0.08
    local_safety_stop_slow_zone_force_stop_sec: 0.35
    local_safety_stop_creep_stop_margin: 0.12

    path_collision_monitor_enable: true
    path_collision_monitor_cloud_frame: map
    path_collision_monitor_path_sample_step: 0.15
    path_collision_monitor_max_check_distance: 5.0
    path_collision_monitor_min_points: 2
    path_collision_monitor_check_min_z: -0.15
    path_collision_monitor_check_max_z: 0.85
    path_collision_monitor_log_throttle_sec: 1.0

    path_replan_enable: true
    path_replan_blocked_hold_sec: 1.0
    path_replan_cooldown_sec: 3.0
    path_replan_external_preblocked_topic: /edited_preblocked_cells_markers
    path_replan_voxel_resolution: 0.1
    path_replan_roi_radius_m: 0.8
    path_replan_min_points_per_voxel: 1
    path_replan_blocked_clear_grace_sec: 0.25
    path_replan_relax_local_safety_sec: 6.0
    path_replan_relax_stop_distance: 0.30
    path_replan_relax_disable_creep_force_stop: true
